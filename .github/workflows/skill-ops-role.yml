# Manually show or grant skill_ops_admin on one existing production membership.
# Uses the same KUBERNETES_* secrets as the release deployment.
name: skill-ops-role

on:
  workflow_dispatch:
    inputs:
      action:
        description: image shows the deployed Control image; status shows roles; grant adds skill_ops_admin
        type: choice
        options: [image, logs, find, status, grant, restore-hub-v1.7.24]
        default: status
      email:
        description: login email to look up (find only)
        required: false
        type: string
      subject:
        description: exact Login subject (not needed for image)
        required: false
        type: string
      organization:
        description: exact organization ID (not needed for image)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: verdantflare-service-control-release
  cancel-in-progress: false

jobs:
  role:
    runs-on: ubuntu-latest
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        env:
          KUBERNETES_SERVER: ${{ secrets.KUBERNETES_SERVER }}
          KUBERNETES_TOKEN: ${{ secrets.KUBERNETES_TOKEN }}
          KUBERNETES_CA: ${{ secrets.KUBERNETES_CA }}
        run: |
          set -eu
          test -n "$KUBERNETES_SERVER"
          test -n "$KUBERNETES_TOKEN"
          if [ "$KUBERNETES_SERVER" != 'https://kubernetes.verdantflare.ai' ]; then
            echo 'Refusing: Kubernetes API is not the current Center production endpoint' >&2
            exit 1
          fi
          if [ -n "$KUBERNETES_CA" ]; then
            ca_file="$RUNNER_TEMP/kubernetes-ca.crt"
            printf '%s\n' "$KUBERNETES_CA" > "$ca_file"
            kubectl config set-cluster verdantflare --server="$KUBERNETES_SERVER" --certificate-authority="$ca_file" --embed-certs=true
          else
            kubectl config set-cluster verdantflare --server="$KUBERNETES_SERVER"
          fi
          kubectl config set-credentials github-actions --token="$KUBERNETES_TOKEN"
          kubectl config set-context verdantflare --cluster=verdantflare --user=github-actions --namespace=verdantflare

      - name: Show deployed Control image
        run: |
          kubectl --context verdantflare -n verdantflare get deployment verdantflare-service-control \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="verdantflare-service-control")].image}{"\n"}'
          kubectl --context verdantflare -n verdantflare rollout status deployment/verdantflare-service-control --timeout=30s
          for app in verdantflare-service-control verdantflare-hub; do
            echo "== recent ReplicaSets for $app"
            kubectl --context verdantflare -n verdantflare get rs -o json \
              | jq -r --arg app "$app" '.items[] | select(.metadata.ownerReferences[0].name == $app) | [.metadata.creationTimestamp, .metadata.annotations["deployment.kubernetes.io/revision"], (.spec.template.spec.containers[0].image), (.status.replicas|tostring)] | @tsv' \
              | sort | tail -6
          done
          echo "== recent events for Control pods"
          kubectl --context verdantflare -n verdantflare get events --sort-by=.lastTimestamp -o json \
            | jq -r '.items[] | select(.involvedObject.name | startswith("verdantflare-service-control")) | [.lastTimestamp, .involvedObject.name, .reason, (.message|.[0:300])] | @tsv' | tail -25

      - name: Show recent skill-release request logs (read-only)
        if: inputs.action == 'logs'
        run: |
          set -u
          echo "== Control: failures and skill-release requests, last 3h"
          kubectl --context verdantflare -n verdantflare logs deployment/verdantflare-service-control -c verdantflare-service-control --since=3h --all-containers=false \
            | grep -E 'request failed|skill-release|skill_release|panic|level=ERROR' | tail -60 || true
          echo "== Hub nginx: skill-release requests and errors, last 3h"
          kubectl --context verdantflare -n verdantflare logs deployment/verdantflare-hub --since=3h \
            | grep -E 'skill-release|\[error\]|\[crit\]' | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/x.x.x.x/g' | tail -40 || true
          echo "== Hub image, mounts and effective body-size / auth settings"
          kubectl --context verdantflare -n verdantflare get deployment verdantflare-hub -o json \
            | jq -c '.spec.template.spec | {image: .containers[0].image, mounts: .containers[0].volumeMounts, volumes: .volumes}'
          kubectl --context verdantflare -n verdantflare exec deployment/verdantflare-hub -- nginx -T 2>&1 \
            | grep -nE 'nginx version|configuration file|location |client_max_body_size|auth_request ' || true

      - name: Roll Hub back to the hub-v1.7.24 ReplicaSet
        if: inputs.action == 'restore-hub-v1.7.24'
        run: |
          set -eu
          image="$(kubectl --context verdantflare -n verdantflare get rs -o json | jq -r '.items[] | select(.metadata.ownerReferences[0].name == "verdantflare-hub" and .metadata.annotations["deployment.kubernetes.io/revision"] == "15") | .spec.template.spec.containers[0].image')"
          test "$image" = 'ghcr.io/verdantflarehub/verdantflare-hub:hub-v1.7.24'
          kubectl --context verdantflare -n verdantflare rollout undo deployment/verdantflare-hub --to-revision=15
          kubectl --context verdantflare -n verdantflare rollout status deployment/verdantflare-hub --timeout=5m
          kubectl --context verdantflare -n verdantflare get deployment verdantflare-hub -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

      - name: Find Center users by email (read-only)
        if: inputs.action == 'find'
        env:
          EMAIL: ${{ inputs.email }}
        run: |
          set -eu
          printf '%s' "$EMAIL" | grep -Eqx '[A-Za-z0-9._%+-]{1,64}@[A-Za-z0-9.-]{1,190}'
          pod="$(kubectl --context verdantflare -n verdantflare get pods -l app=postgres,owner=sc -o jsonpath='{.items[0].metadata.name}')"
          test -n "$pod"
          printf '%s\n' "SELECT u.key AS subject, m->>'organizationId' AS organization, m->'roles' AS roles, coalesce(m->>'status','') AS status FROM control_repository_state s, jsonb_each(s.state->'users') u, jsonb_array_elements(coalesce(u.value->'Memberships','[]'::jsonb)) m WHERE lower(u.value->>'Email') = lower(:'email');" \
            | kubectl --context verdantflare -n verdantflare exec -i "$pod" -c postgres -- \
              sh -ec 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d control -A -F " | " -v email="$1"' sh "$EMAIL"

      - name: Back up Control database before a grant
        if: inputs.action == 'grant'
        run: |
          set -eu
          pod="$(kubectl --context verdantflare -n verdantflare get pods -l app=postgres,owner=sc -o jsonpath='{.items[0].metadata.name}')"
          test -n "$pod"
          kubectl --context verdantflare -n verdantflare exec "$pod" -c postgres -- sh -ec '
            umask 077
            backup_dir=/var/lib/postgresql/data/backups
            mkdir -p "$backup_dir"
            backup_file="$backup_dir/control-skill-ops-role-$(date -u +%Y%m%dT%H%M%SZ).dump"
            pg_dump -Fc -U "$POSTGRES_USER" -d control -f "$backup_file"
            test -s "$backup_file"
            pg_restore -l "$backup_file" >/dev/null
            echo "Control database backup verified: $backup_file"
          '

      - name: Run skill-ops-role in Control
        if: inputs.action == 'status' || inputs.action == 'grant'
        env:
          ACTION: ${{ inputs.action }}
          SUBJECT: ${{ inputs.subject }}
          ORGANIZATION: ${{ inputs.organization }}
        run: |
          set -eu
          printf '%s' "$SUBJECT" | grep -Eqx '[A-Za-z0-9_.:@-]{1,128}'
          printf '%s' "$ORGANIZATION" | grep -Eqx '[A-Za-z0-9_.:@-]{1,128}'
          kubectl --context verdantflare -n verdantflare exec deployment/verdantflare-service-control -c verdantflare-service-control -- \
            /skill-ops-role -action "$ACTION" -subject "$SUBJECT" -organization "$ORGANIZATION"

# ADMIN CONFIG REQUIRED:
# Configure the repository secrets documented in the deployment README and create/protect the release branch.
name: build

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: ${{ github.ref == 'refs/heads/dev' && 'service-control-v1.5.0-dev.1' || 'service-control-v1.5.0' }}

concurrency:
  group: verdantflare-service-control-release
  cancel-in-progress: false

jobs:
  build:
    name: Test and build image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image metadata
        id: image
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
        run: |
          registry_endpoint="${REGISTRY_ENDPOINT%/}"

          if [ -z "$registry_endpoint" ]; then
            echo "REGISTRY_ENDPOINT_ALIYUN is required" >&2
            exit 1
          fi

          echo "registry_endpoint=$registry_endpoint" >> "$GITHUB_OUTPUT"
          echo "image_name=$registry_endpoint/wod/verdantflare" >> "$GITHUB_OUTPUT"

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry_endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Refuse an existing image tag
        run: '! docker buildx imagetools inspect "${{ steps.image.outputs.image_name }}:${{ env.VERSION }}" >/dev/null 2>&1'

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.image_name }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image push success
        run: echo "${{ steps.image.outputs.image_name }}:${{ env.VERSION }} built and pushed successfully!"

  deploy:
    name: Deploy Service Control to Kubernetes
    needs: build
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        env:
          KUBERNETES_SERVER: ${{ secrets.KUBERNETES_SERVER }}
          KUBERNETES_TOKEN: ${{ secrets.KUBERNETES_TOKEN }}
          KUBERNETES_CA: ${{ secrets.KUBERNETES_CA }}
        run: |
          set -eu
          test -n "$KUBERNETES_SERVER"
          test -n "$KUBERNETES_TOKEN"

          if [ -n "$KUBERNETES_CA" ]; then
            ca_file="$RUNNER_TEMP/kubernetes-ca.crt"
            printf '%s\n' "$KUBERNETES_CA" > "$ca_file"
            kubectl config set-cluster verdantflare \
              --server="$KUBERNETES_SERVER" \
              --certificate-authority="$ca_file" \
              --embed-certs=true
          else
            kubectl config set-cluster verdantflare \
              --server="$KUBERNETES_SERVER" \
              --insecure-skip-tls-verify=true
          fi

          kubectl config set-credentials github-actions --token="$KUBERNETES_TOKEN"
          kubectl config set-context verdantflare \
            --cluster=verdantflare \
            --user=github-actions \
            --namespace=verdantflare

      - name: Update Service Control deployment
        run: |
          image="registry.cn-qingdao.aliyuncs.com/wod/verdantflare:${VERSION}"
          kubectl --context verdantflare -n verdantflare set image deployment/verdantflare-service-control verdantflare-service-control="$image"
          kubectl --context verdantflare -n verdantflare rollout status deployment/verdantflare-service-control --timeout=5m
          kubectl --context verdantflare -n verdantflare get deployment/verdantflare-service-control -o jsonpath='{.spec.template.spec.containers[?(@.name=="verdantflare-service-control")].image}{"\n"}'

# ADMIN CONFIG REQUIRED:
# Configure the KUBERNETES_* repository secrets documented in the deployment README and create/protect the release branch.
name: build

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/verdantflarehub/verdantflare-service-control
  VERSION: ${{ github.ref == 'refs/heads/dev' && 'service-control-v1.7.22-dev.1' || 'service-control-v1.7.22' }}

concurrency:
  group: verdantflare-service-control-release
  cancel-in-progress: false

jobs:
  build:
    name: Test and build image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing image tag
        run: '! docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:${{ env.VERSION }}" >/dev/null 2>&1'

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image push success
        run: echo "${{ env.IMAGE_NAME }}:${{ env.VERSION }} built and pushed successfully!"

  deploy:
    name: Deploy Service Control to Kubernetes
    needs: build
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migration
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        env:
          KUBERNETES_SERVER: ${{ secrets.KUBERNETES_SERVER }}
          KUBERNETES_TOKEN: ${{ secrets.KUBERNETES_TOKEN }}
          KUBERNETES_CA: ${{ secrets.KUBERNETES_CA }}
        run: |
          set -eu
          test -n "$KUBERNETES_SERVER"
          test -n "$KUBERNETES_TOKEN"
          if [ "$KUBERNETES_SERVER" != 'https://kubernetes.verdantflare.ai' ]; then
            echo 'Refusing to deploy: Kubernetes API is not the current Center production endpoint' >&2
            exit 1
          fi

          if [ -n "$KUBERNETES_CA" ]; then
            ca_file="$RUNNER_TEMP/kubernetes-ca.crt"
            printf '%s\n' "$KUBERNETES_CA" > "$ca_file"
            kubectl config set-cluster verdantflare \
              --server="$KUBERNETES_SERVER" \
              --certificate-authority="$ca_file" \
              --embed-certs=true
          else
            kubectl config set-cluster verdantflare \
              --server="$KUBERNETES_SERVER"
          fi

          kubectl config set-credentials github-actions --token="$KUBERNETES_TOKEN"
          kubectl config set-context verdantflare \
            --cluster=verdantflare \
            --user=github-actions \
            --namespace=verdantflare

      - name: Back up Control database and apply additive survey migration
        run: |
          set -eu
          current="$(kubectl --context verdantflare -n verdantflare get deployment verdantflare-service-control -o jsonpath='{.spec.template.spec.containers[?(@.name=="verdantflare-service-control")].image}')"
          test "$current" = 'ghcr.io/verdantflarehub/verdantflare-service-control:service-control-v1.7.21'
          kubectl --context verdantflare -n verdantflare rollout status deployment/postgres --timeout=2m
          pod="$(kubectl --context verdantflare -n verdantflare get pods -l app=postgres,owner=sc -o jsonpath='{.items[0].metadata.name}')"
          test -n "$pod"
          kubectl --context verdantflare -n verdantflare exec "$pod" -c postgres -- sh -ec '
            umask 077
            backup_dir=/var/lib/postgresql/data/backups
            mkdir -p "$backup_dir"
            backup_file="$backup_dir/control-survey-$(date -u +%Y%m%dT%H%M%SZ).dump"
            pg_dump -Fc -U "$POSTGRES_USER" -d control -f "$backup_file"
            test -s "$backup_file"
            pg_restore -l "$backup_file" >/dev/null
            echo "Control database backup verified on PostgreSQL PVC"
          '
          kubectl --context verdantflare -n verdantflare exec -i "$pod" -c postgres -- \
            sh -ec 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d control' \
            < migrations/postgres/007_survey_rows.sql
          printf "SELECT storage_version FROM control_survey_state WHERE survey_id='yunnan-202610';\n" \
            | kubectl --context verdantflare -n verdantflare exec -i "$pod" -c postgres -- \
              sh -ec 'psql -XAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d control' \
            | grep -Eq '^[12]$'

      - name: Configure GHCR pull secret and update Service Control deployment
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          kubectl --context verdantflare -n verdantflare create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USER" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl --context verdantflare -n verdantflare apply -f -
          kubectl --context verdantflare -n verdantflare patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

          kubectl --context verdantflare -n verdantflare get secret login-directory-bridge -o json \
            | jq -e '(.data.TOKEN // "") != ""' >/dev/null
          kubectl --context verdantflare -n verdantflare patch deployment verdantflare-service-control --type strategic \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"verdantflare-service-control","env":[{"name":"CONTROL_ALLOWED_ORIGINS","value":"https://hub.verdantflare.ai"},{"name":"CONTROL_CHART_REGISTRY_HOST","value":"registry.verdantflare.ai"},{"name":"CONTROL_CHART_REGISTRY_INTERNAL_URL","value":"http://registry.verdantflare.svc.cluster.local:8080"},{"name":"CONTROL_LOGIN_DIRECTORY_BASE_URL","value":"http://verdantflare-login-api.verdantflare.svc.cluster.local:8088"},{"name":"CONTROL_LOGIN_DIRECTORY_TOKEN","valueFrom":{"secretKeyRef":{"name":"login-directory-bridge","key":"TOKEN"}}}]}]}}}}'
          kubectl --context verdantflare -n verdantflare rollout status deployment/verdantflare-service-control --timeout=5m
          image="${IMAGE_NAME}:${VERSION}"
          kubectl --context verdantflare -n verdantflare set image deployment/verdantflare-service-control verdantflare-service-control="$image"
          kubectl --context verdantflare -n verdantflare rollout status deployment/verdantflare-service-control --timeout=5m
          kubectl --context verdantflare -n verdantflare get deployment/verdantflare-service-control -o jsonpath='{.spec.template.spec.containers[?(@.name=="verdantflare-service-control")].image}{"\n"}'

      - name: Verify survey preservation and cut over rows
        run: |
          set -eu
          target=deployment/verdantflare-service-control
          before="$(kubectl --context verdantflare -n verdantflare exec "$target" -c verdantflare-service-control -- /survey-storage -action status -survey yunnan-202610)"
          echo "$before" | jq -e '.open == true and (.storageVersion == 1 or .storageVersion == 2)' >/dev/null
          kubectl --context verdantflare -n verdantflare exec "$target" -c verdantflare-service-control -- \
            /survey-storage -action cutover -survey yunnan-202610
          after="$(kubectl --context verdantflare -n verdantflare exec "$target" -c verdantflare-service-control -- /survey-storage -action status -survey yunnan-202610)"
          jq -en --argjson before "$before" --argjson after "$after" \
            '$after.storageVersion == 2 and $after.open == $before.open and $after.settingsVersion == $before.settingsVersion' >/dev/null
          printf 'Before cutover: %s\nAfter cutover: %s\n' "$before" "$after"
